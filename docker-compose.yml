services:
  # --- CLOUDFLARE TUNNEL ---
  # Cloudflare Tunnel gestisce la sicurezza, SSL e instradamento senza porte aperte
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - common-network

  # --- WATCHTOWER ---
  # Controlla se ci sono nuove versioni delle immagini sul registry e le scarica/riavvia automaticamente.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json
    command: --interval 300 --cleanup
    restart: always

  # --- STATIC FILE SERVER ---
  # Serve le SPA statiche che non hanno un container dedicato.
  static-files:
    image: nginx:alpine
    container_name: static-files
    volumes:
      - ./calcolatore-finanze:/var/www/calcolatore-finanze:ro
      - ./calcolatore-tasse:/var/www/calcolatore-tasse:ro
      - ./static-files/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./seos:/var/www/seos:ro
    networks:
      - common-network
    restart: always

  # --- PORTFOLIO APPLICATION ---
  portfolio:
    image: ghcr.io/roberto-ingenito-home-lab/portfolio-app:latest
    container_name: portfolio-app
    expose:
      - "80"
    networks:
      - common-network
    restart: always

  # --- CASHLY APPLICATION ---
  # Backend .NET Core
  cashly-back-end:
    image: ghcr.io/roberto-ingenito-home-lab/cashly-back-end:latest
    container_name: cashly-back-end
    expose:
      - "80"
    depends_on:
      cashly-database:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=cashly-database;Database=${CASHLY_POSTGRES_DB};Username=${CASHLY_POSTGRES_USER};Password=${CASHLY_POSTGRES_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
    networks:
      - common-network
    restart: always

  # Database Postgres per Cashly
  cashly-database:
    container_name: cashly-database
    image: postgres:18-alpine3.22
    ports:
      - "5116:5432"
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${CASHLY_POSTGRES_USER}
      - POSTGRES_PASSWORD=${CASHLY_POSTGRES_PASSWORD}
      - POSTGRES_DB=${CASHLY_POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - common-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CASHLY_POSTGRES_USER} -d ${CASHLY_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Frontend Angular (nginx)
  cashly-front-end:
    image: ghcr.io/roberto-ingenito-home-lab/cashly-front-end:latest
    container_name: cashly-front-end
    expose:
      - "80"
    networks:
      - common-network
    restart: always
    depends_on:
      - cashly-back-end

  # --- ADDITIONAL APPS ---
  # Servizio Timesheet
  fortil-excel-timesheet:
    image: ghcr.io/roberto-ingenito-home-lab/fortil-excel-timesheet:latest
    container_name: fortil-excel-timesheet-app
    expose:
      - "3000"
    networks:
      - common-network
    restart: unless-stopped

  # --- NEXTCLOUD SERVICES ---
  # Applicazione Nextcloud (Cloud storage)
  nextcloud:
    container_name: nextcloud-app
    image: nextcloud:32-apache
    expose:
      - "80"
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=nextcloud-db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_DOMAIN}
      - TRUSTED_PROXIES=172.16.0.0/12
      - OVERWRITEHOST=${NEXTCLOUD_DOMAIN}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=${NEXTCLOUD_CLI_URL}
    volumes:
      - nextcloud_data:/var/www/html
      - /mnt/storage/nextcloud/data:/var/www/html/data
    networks:
      - common-network
    restart: always

  # Database Postgres specifico per Nextcloud
  nextcloud-db:
    container_name: nextcloud-db
    image: postgres:18-alpine3.22
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - POSTGRES_DB=nextcloud
    volumes:
      - nextcloud_db_data:/var/lib/postgresql
    networks:
      - common-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis per il caching e file locking di Nextcloud
  nextcloud-redis:
    container_name: nextcloud-redis
    image: redis:alpine
    expose:
      - "6379"
    networks:
      - common-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Servizio Cron per le operazioni in background di Nextcloud
  nextcloud-cron:
    container_name: nextcloud-cron
    image: nextcloud:32-apache
    entrypoint: /cron.sh
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
      nextcloud:
        condition: service_started
    volumes:
      - nextcloud_data:/var/www/html
      - /mnt/storage/nextcloud/data:/var/www/html/data
    networks:
      - common-network
    restart: always

  # --- MR. WHITE GAME ---
  mr-white-back-end:
    image: ghcr.io/roberto-ingenito-home-lab/mr-white-back-end:latest
    container_name: mr-white-back-end
    expose:
      - "80"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:80
    networks:
      - common-network
    restart: always

  mr-white-front-end:
    image: ghcr.io/roberto-ingenito-home-lab/mr-white-front-end:latest
    container_name: mr-white-front-end
    expose:
      - "3000"
    environment:
      - NODE_ENV=${NODE_ENV}
    networks:
      - common-network
    restart: always
    depends_on:
      - mr-white-back-end

  # --- LAFA TOOLS APPLICATION ---
  # Backend .NET Core API
  lafa-tools-back-end:
    image: ghcr.io/roberto-ingenito-home-lab/lafa-tools-back-end:latest
    container_name: lafa-tools-back-end
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - LAFA_SUPABASE_URL=${LAFA_SUPABASE_URL}
      - LAFA_SUPABASE_ANON_KEY=${LAFA_SUPABASE_ANON_KEY}
      - LAFA_FRONTEND_ORIGIN=${LAFA_FRONTEND_ORIGIN}
      - LAFA_LOGIN_PASSWORD=${LAFA_LOGIN_PASSWORD}
    networks:
      - common-network
    restart: always

  # Frontend Angular (nginx)
  lafa-tools-front-end:
    image: ghcr.io/roberto-ingenito-home-lab/lafa-tools-front-end:latest
    container_name: lafa-tools-front-end
    expose:
      - "80"
    networks:
      - common-network
    restart: always
    depends_on:
      - lafa-tools-back-end

  # --- COUCHDB (Obsidian LiveSync) ---
  couchdb-obsidian:
    image: couchdb:3
    container_name: couchdb-obsidian
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_OBSIDIAN_USER}
      COUCHDB_PASSWORD: ${COUCHDB_OBSIDIAN_PASSWORD}
    volumes:
      - couchdb_obsidian_data:/opt/couchdb/data
    ports:
      - "5984:5984" # Accesso diretto per configurazione e debug
    expose:
      - "5984"
    networks:
      - common-network

  # --- AFFiNE SERVICES ---
  affine-postgres:
    image: postgres:18-alpine
    container_name: affine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AFFINE_DB_USER}
      POSTGRES_PASSWORD: ${AFFINE_DB_PASSWORD}
      POSTGRES_DB: ${AFFINE_DB_NAME}
    volumes:
      - /mnt/storage/affine/postgres:/var/lib/postgresql
    networks:
      - common-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AFFINE_DB_USER} -d ${AFFINE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  affine-redis:
    image: redis:7-alpine
    container_name: affine-redis
    restart: unless-stopped
    networks:
      - common-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  affine-migration:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine-migration
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    depends_on:
      affine-postgres:
        condition: service_healthy
      affine-redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=${AFFINE_DATABASE_URL}
      - REDIS_SERVER_HOST=affine-redis
      - NODE_ENV=production
    volumes:
      - /mnt/storage/affine/config:/root/.affine/config
      - /mnt/storage/affine/storage:/root/.affine/storage
    networks:
      - common-network

  affine-server:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine-server
    restart: unless-stopped
    ports:
      - "3010:3010"
    depends_on:
      affine-postgres:
        condition: service_healthy
      affine-redis:
        condition: service_healthy
      affine-migration:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${AFFINE_DATABASE_URL}
      - REDIS_SERVER_HOST=affine-redis
      - AFFINE_SERVER_EXTERNAL_URL=${AFFINE_SERVER_EXTERNAL_URL}
      - AFFINE_SERVER_PORT=3010
      - NODE_ENV=production
    volumes:
      - /mnt/storage/affine/config:/root/.affine/config
      - /mnt/storage/affine/storage:/root/.affine/storage
    networks:
      - common-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3010/api/health || node -e \"require('http').get('http://localhost:3010/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# --- NETWORKS ---
networks:
  common-network:
    driver: bridge
    name: common-network

# --- VOLUMES ---
volumes:
  postgres_data:
    external: true
    name: cashly-db_postgres_data
  nextcloud_db_data:
    external: true
    name: nextcloud-db_data
  nextcloud_data:
    external: true
    name: nextcloud_app_data
  couchdb_obsidian_data:
    external: true
    name: couchdb_obsidian_data
