services:
  appflowy-postgres:
    image: pgvector/pgvector:pg16
    container_name: appflowy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APPFLOWY_DB_USER}
      POSTGRES_PASSWORD: ${APPFLOWY_DB_PASSWORD}
      POSTGRES_DB: ${APPFLOWY_DB_NAME}
      PGPORT: 5432
    volumes:
      - appflowy_postgres_data:/var/lib/postgresql/data
    networks:
      - common-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${APPFLOWY_DB_USER}", "-d", "${APPFLOWY_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  appflowy-redis:
    image: redis:alpine
    container_name: appflowy-redis
    restart: unless-stopped
    networks:
      - common-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  appflowy-minio:
    image: minio/minio
    container_name: appflowy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_BROWSER_REDIRECT_URL: ${APPFLOWY_SERVER_EXTERNAL_URL}/minio
      MINIO_ROOT_USER: ${APPFLOWY_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${APPFLOWY_MINIO_PASSWORD}
    volumes:
      - appflowy_minio_data:/data
    networks:
      - common-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  appflowy-gotrue:
    image: appflowyinc/gotrue:latest
    container_name: appflowy-gotrue
    restart: unless-stopped
    depends_on:
      appflowy-postgres:
        condition: service_healthy
    healthcheck:
      test: "curl --fail http://127.0.0.1:9999/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      GOTRUE_ADMIN_EMAIL: ${APPFLOWY_ADMIN_EMAIL}
      GOTRUE_ADMIN_PASSWORD: ${APPFLOWY_ADMIN_PASSWORD}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_SITE_URL: "appflowy-flutter://"
      GOTRUE_URI_ALLOW_LIST: "**"
      GOTRUE_JWT_SECRET: ${APPFLOWY_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ADMIN_GROUP_NAME: "supabase_admin"
      GOTRUE_DB_DRIVER: "postgres"
      DATABASE_URL: "postgresql://${APPFLOWY_DB_USER}:${APPFLOWY_DB_PASSWORD}@appflowy-postgres:5432/${APPFLOWY_DB_NAME}?sslmode=disable"
      API_EXTERNAL_URL: "${APPFLOWY_SERVER_EXTERNAL_URL}/gotrue"
    networks:
      - common-network

  appflowy-cloud:
    image: appflowyinc/appflowy_cloud:latest
    container_name: appflowy-cloud
    restart: unless-stopped
    depends_on:
      appflowy-gotrue:
        condition: service_healthy
      appflowy-postgres:
        condition: service_healthy
      appflowy-redis:
        condition: service_healthy
    healthcheck:
      test: "curl --fail http://127.0.0.1:8000/api/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      APPFLOWY_ENVIRONMENT: "production"
      APPFLOWY_DATABASE_URL: "postgresql://${APPFLOWY_DB_USER}:${APPFLOWY_DB_PASSWORD}@appflowy-postgres:5432/${APPFLOWY_DB_NAME}?sslmode=disable"
      APPFLOWY_REDIS_URI: "redis://appflowy-redis:6379"
      APPFLOWY_GOTRUE_JWT_SECRET: ${APPFLOWY_JWT_SECRET}
      APPFLOWY_GOTRUE_BASE_URL: "http://appflowy-gotrue:9999"
      APPFLOWY_S3_USE_MINIO: "true"
      APPFLOWY_S3_CREATE_BUCKET: "true"
      APPFLOWY_S3_MINIO_URL: "http://appflowy-minio:9000"
      APPFLOWY_S3_ACCESS_KEY: ${APPFLOWY_MINIO_USER}
      APPFLOWY_S3_SECRET_KEY: ${APPFLOWY_MINIO_PASSWORD}
      APPFLOWY_S3_BUCKET: "appflowy"
      APPFLOWY_S3_PRESIGNED_URL_ENDPOINT: "${APPFLOWY_SERVER_EXTERNAL_URL}/minio-api"
      APPFLOWY_ACCESS_CONTROL: "public"
      APPFLOWY_BASE_URL: ${APPFLOWY_SERVER_EXTERNAL_URL}
      AI_ENABLED: "false"
    networks:
      - common-network

  appflowy-worker:
    image: appflowyinc/appflowy_worker:latest
    container_name: appflowy-worker
    restart: unless-stopped
    depends_on:
      appflowy-postgres:
        condition: service_healthy
      appflowy-cloud:
        condition: service_healthy
    environment:
      RUST_LOG: "info"
      APPFLOWY_ENVIRONMENT: "production"
      APPFLOWY_WORKER_REDIS_URL: "redis://appflowy-redis:6379"
      APPFLOWY_WORKER_DATABASE_URL: "postgres://${APPFLOWY_DB_USER}:${APPFLOWY_DB_PASSWORD}@appflowy-postgres:5432/${APPFLOWY_DB_NAME}"
      APPFLOWY_WORKER_DATABASE_NAME: ${APPFLOWY_DB_NAME}
      APPFLOWY_WORKER_IMPORT_TICK_INTERVAL: 30
      APPFLOWY_S3_USE_MINIO: "true"
      APPFLOWY_S3_MINIO_URL: "http://appflowy-minio:9000"
      APPFLOWY_S3_ACCESS_KEY: ${APPFLOWY_MINIO_USER}
      APPFLOWY_S3_SECRET_KEY: ${APPFLOWY_MINIO_PASSWORD}
      APPFLOWY_S3_BUCKET: "appflowy"
    networks:
      - common-network

  appflowy-search:
    image: appflowyinc/appflowy_search:latest
    container_name: appflowy-search
    restart: unless-stopped
    depends_on:
      appflowy-postgres:
        condition: service_healthy
    environment:
      RUST_LOG: "info"
      APPFLOWY_SEARCH_HOST: "[::]"
      APPFLOWY_SEARCH_PORT: 4002
      APPFLOWY_SEARCH_DATABASE_URL: "postgres://${APPFLOWY_DB_USER}:${APPFLOWY_DB_PASSWORD}@appflowy-postgres:5432/${APPFLOWY_DB_NAME}"
      APPFLOWY_SEARCH_REDIS_URL: "redis://appflowy-redis:6379"
      APPFLOWY_S3_USE_MINIO: "true"
      APPFLOWY_S3_MINIO_URL: "http://appflowy-minio:9000"
      APPFLOWY_S3_ACCESS_KEY: ${APPFLOWY_MINIO_USER}
      APPFLOWY_S3_SECRET_KEY: ${APPFLOWY_MINIO_PASSWORD}
      APPFLOWY_S3_BUCKET: "appflowy"
      APPFLOWY_BACKGROUND_INDEXER_ENABLED: "true"
      APPFLOWY_KEYWORD_SEARCH_ENABLED: "true"
      APPFLOWY_KEYWORD_WORKER_ENABLED: "true"
      APPFLOWY_KEYWORD_INDEX_DIR: "/var/lib/appflowy/keyword_index"
      APPFLOWY_GOTRUE_JWT_SECRET: ${APPFLOWY_JWT_SECRET}
    volumes:
      - appflowy_search_data:/var/lib/appflowy/keyword_index
    networks:
      - common-network

  appflowy-nginx:
    image: nginx:alpine
    container_name: appflowy-nginx
    restart: unless-stopped
    ports:
      - "3020:80"
    volumes:
      - ../appflowy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      appflowy-cloud:
        condition: service_healthy
    networks:
      - common-network

networks:
  common-network:
    external: true
    name: common-network

volumes:
  appflowy_postgres_data:
  appflowy_minio_data:
  appflowy_search_data:
