services:
  # --- CLOUDFLARE TUNNEL ---
  # Cloudflare Tunnel gestisce la sicurezza, SSL e instradamento senza porte aperte
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - common-network

  # --- WATCHTOWER (Event-driven via HTTP API) ---
  # Aggiorna i container solo su richiesta HTTP/Webhook (es. da GitHub Actions)
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_API_TOKEN}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=false
      - WATCHTOWER_CLEANUP=true
    networks:
      - common-network

  # --- STATIC FILE SERVER ---
  # Serve le SPA statiche che non hanno un container dedicato.
  static-files:
    image: nginx:alpine
    container_name: static-files
    volumes:
      - ../calcolatore-finanze:/var/www/calcolatore-finanze:ro
      - ../calcolatore-tasse:/var/www/calcolatore-tasse:ro
      - ../static-files/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../seos:/var/www/seos:ro
    networks:
      - common-network
    restart: always

  # --- CLOUDFLARE DDNS ---
  # Aggiorna automaticamente il record DNS su Cloudflare se l'IP di casa cambia.
  cloudflare-ddns:
    image: oznu/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    restart: always
    environment:
      - API_KEY=${CLOUDFLARE_API_TOKEN_DDNS}
      - ZONE=${CLOUDFLARE_ZONE} # Il tuo dominio principale (es. tuodominio.com)
      - SUBDOMAIN=ssh           # Il sottodominio da aggiornare
      - PROXIED=false           # DEVE essere false (nuvoletta grigia) per SSH diretto
    networks:
      - common-network

networks:
  common-network:
    external: true
    name: common-network
