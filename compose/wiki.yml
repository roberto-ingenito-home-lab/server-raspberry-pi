services:
  # --- WIKI (DIGITAL BRAIN) ---
  wiki:
    image: ghcr.io/roberto-ingenito-home-lab/wiki:latest
    container_name: wiki
    expose:
      - "80"
    environment:
      - WIKI_PASSWORD=${WIKI_PASSWORD}
    networks:
      - common-network
    restart: always

networks:
  common-network:
    external: true
    name: common-network
